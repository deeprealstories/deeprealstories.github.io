<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Real Stories ( एक हकीकत जीवन की ) | Official Website</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fullscreen Clean Background Container -->
  <div class="bg-layer">
    <img src="background.jpg" alt="Deep Real Stories Background" class="bg-img" />
  </div>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <nav class="nav-links">
      <a href="#home" class="active">HOME</a>
      <a href="#music">MUSIC</a>
      <a href="#youtube">YOUTUBE</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <!-- Left Side Logo Overlay (Positioned above standing figure) -->
  <div class="left-logo-box">
    <img src="logo.png" alt="Logo" class="left-logo-img" />
  </div>

  <!-- Right Top Manu Memorial Card -->
  <div class="right-manu-box">
    <div class="manu-card">
      <img src="manu.jpg" alt="In Memory of Manu" class="manu-img" />
      <span class="manu-text">❤️ In Memory of Manu</span>
    </div>
  </div>

  <!-- Right Bottom Dpk Overlay (Positioned near tree) -->
  <div class="right-dpk-box">
    <img src="Dpk.png" alt="Deep Chaudhary" class="dpk-img" />
  </div>

  <!-- Clickable Button Hotspot overlaying the background image button -->
  <div class="cta-overlay">
    <a href="#music" class="explore-hotspot">EXPLORE MUSIC</a>
  </div>

</body>
</html>

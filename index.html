<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Chaudhary (Dabba Bhai) | Deep Real Stories</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fullscreen Main Background Image -->
  <div class="bg-wrapper">
    <img src="background.jpg" alt="Background" class="main-bg-img" />
  </div>

  <!-- Header Section -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#home" class="brand-logo">
        <img src="logo.png" alt="Logo" class="nav-logo-img" />
      </a>

      <nav class="nav-menu" id="nav-menu">
        <a href="#home" class="nav-link active">Home</a>
        <a href="#music" class="nav-link">Music</a>
        <a href="#youtube" class="nav-link">YouTube</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>

      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Hero Layout -->
  <main class="hero-section" id="home">
    <div class="hero-container">
      
      <!-- Center Button overlay -->
      <div class="center-cta">
        <a href="#music" class="gold-action-btn">Explore Music</a>
      </div>

      <!-- Right Side Profile Overlay -->
      <div class="right-profile">
        <img src="Dpk.png" alt="Deep Chaudhary" class="dpk-img" />
      </div>

    </div>
  </main>

  <script>
    const mobileToggle = document.getElementById('mobile-toggle');
    const navMenu = document.getElementById('nav-menu');

    mobileToggle.addEventListener('click', () => {
      mobileToggle.classList.toggle('active');
      navMenu.classList.toggle('open');
    });
  </script>
</body>
</html>

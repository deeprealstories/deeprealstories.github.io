<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Real Stories ( एक हकीकत जीवन की ) | Official Website of Deep Chaudhary (Dabba Bhai)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@500;700;800&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 100% Fullscreen Background -->
  <div class="bg-stage">
    <img src="background.jpg" alt="Background" class="bg-img" />
  </div>

  <!-- Glass Navbar -->
  <header class="top-nav">
    <div class="nav-left">
      <img src="logo.png" alt="Logo" class="nav-logo-small" />
      <span class="nav-title">Deep Real Stories</span>
    </div>
    <nav class="nav-links">
      <a href="#home" class="active">HOME</a>
      <a href="#music">MUSIC</a>
      <a href="#youtube">YOUTUBE</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <!-- Left Side Logo (25%) -->
  <div class="left-logo-zone">
    <img src="logo.png" alt="Deep Real Stories Emblem" class="left-logo-img" />
  </div>

  <!-- Center Typography & CTA Buttons -->
  <main class="center-content-zone">
    <h1 class="hero-title">Deep<br>Real Stories</h1>
    <div class="tagline-row">
      <span class="arrow">⤝</span>
      <p class="hindi-text">( एक हकीकत जीवन की )</p>
      <span class="arrow">⤞</span>
    </div>
    <p class="meta-lead">OFFICIAL WEBSITE OF</p>
    <h2 class="artist-name">Deep Chaudhary</h2>
    <p class="artist-alias">(Dabba Bhai)</p>

    <div class="btn-group">
      <a href="#music" class="btn-gold">🎵 EXPLORE MUSIC</a>
      <a href="#youtube" class="btn-outline">▶ WATCH YOUTUBE</a>
    </div>
  </main>

  <!-- Right Top Manu Memorial Card (25%) -->
  <div class="right-top-manu">
    <div class="manu-card-inner">
      <img src="manu.jpg" alt="In Memory of Manu" class="manu-img" />
      <p class="manu-caption">❤️ In Memory of Manu</p>
    </div>
  </div>

  <!-- Right Bottom Dpk Photo (20%) -->
  <div class="right-bottom-dpk">
    <img src="Dpk.png" alt="Deep Chaudhary" class="dpk-img" />
  </div>

</body>
</html>

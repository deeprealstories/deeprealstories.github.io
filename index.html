<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Chaudhary (Dabba Bhai) | Deep Real Stories</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>

  <!-- Fullscreen Main Background (100% Viewport) -->

    <nav class="center-nav">

      <a href="#contact" class="nav-item">CONTACT</a>
    </nav>

    <!-- Top Right: Photo Badge (20% Size) -->
    <div class="profile-box">
      <img src="Dpk.png" alt="Deep Chaudhary" class="small-profile" />
    </div>

  </header>

  <!-- Invisible Overlay Area for Button Click -->
  <main class="content-area">
    <a href="#music" class="explore-btn">EXPLORE MUSIC</a>
  </main>

</html>

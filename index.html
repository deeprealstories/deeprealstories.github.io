<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Real Stories | Official Website of Deep Chaudhary (Dabba Bhai)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fullscreen Landscape Background -->
  <div class="bg-wrapper">
    <img src="background.jpg" alt="Deep Real Stories Background" class="bg-image" />
  </div>

  <!-- Navbar (Top Navigation Menu Only) -->
  <header class="navbar">
    <nav class="nav-links" id="nav-links">
      <a href="#home" class="nav-item active">HOME</a>
      <a href="#music" class="nav-item">MUSIC</a>
      <a href="#youtube" class="nav-item">YOUTUBE</a>
      <a href="#contact" class="nav-item">CONTACT</a>
    </nav>
  </header>

  <!-- Left Side Logo Overlay (Positioned near standing silhouette) -->
  <div class="left-logo-overlay">
    <img src="logo.png" alt="Deep Real Stories Logo" class="left-logo-img" />
  </div>

  <!-- Right Side Photo Badge Overlay (Bottom Right Corner + 5% Larger) -->
  <div class="right-photo-overlay">
    <img src="Dpk.png" alt="Deep Chaudhary" class="right-photo-img" />
  </div>

  <!-- Bottom Interactive Explore Music CTA Area -->
  <main class="cta-overlay-area">
    <a href="#music" class="explore-btn">EXPLORE MUSIC</a>
  </main>

  <!-- Mobile Toggle Script -->
  <script>
    const navLinks = document.getElementById('nav-links');
    document.querySelectorAll('.nav-item').forEach(link => {
      link.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });
  </script>

</body>
</html>
